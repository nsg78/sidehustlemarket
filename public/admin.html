<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Le comptoir — SIDEHUSTLE</title><link rel="stylesheet" href="/style.css"></head><body><main class="admin"><header><a href="/" class="brand">SIDEHUSTLE®</a><button class="button secondary" id="logout" hidden>Déconnexion</button></header><div class="eyebrow">ESPACE GÉRANT</div><h1 style="font-size:56px">LE COMPTOIR.</h1><p id="message" role="status"></p><form id="login" style="max-width:420px"><label class="field">Email<input type="email" name="email" autocomplete="username" required></label><label class="field">Mot de passe<input type="password" name="password" autocomplete="current-password" required></label><button class="button">Se connecter</button></form><section id="dashboard" hidden><div class="actions"><button class="button" id="new-product">Ajouter une pièce</button><button class="button secondary" id="refresh">Actualiser</button></div><p class="notice">Les commandes sont des demandes à confirmer. Une vente conclue doit être déduite du stock manuellement. Les coordonnées sont réservées à la gestion des demandes.</p><div class="admin-grid"><section><h2>Les demandes.</h2><label class="field">Afficher<select id="request-filter"><option value="">Toutes</option><option value="new">Nouvelles</option><option value="contacted">Contactées</option><option value="done">Terminées</option><option value="cancelled">Annulées</option></select></label><div id="requests"></div></section><section><h2>Le stock.</h2><div id="inventory"></div></section></div></section></main><dialog id="editor"><button class="close" aria-label="Fermer">×</button><h2>La pièce.</h2><form id="product-form"><input type="hidden" name="id"><label class="field">Nom<input name="name" maxlength="150" required></label><label class="field">Catégorie<select name="category"><option>Sneakers</option><option>Streetwear</option><option>Bijoux</option><option>Parfums</option><option>Électronique</option><option>Autres</option></select></label><label class="field">Prix ($)<input name="price" type="number" min="0" max="9999999999" step="0.01" required></label><label class="field">Quantité en stock<input name="stock" type="number" min="0" max="100000" step="1" required></label><label class="field">État<input name="condition" required maxlength="100"></label><label class="field">URL HTTPS de l’image<input name="image_url" type="url" pattern="https://.*" required></label><label class="field">Description<textarea name="description" maxlength="2000"></textarea></label><p id="editor-error" class="error" role="alert"></p><button class="button">Enregistrer</button></form></dialog><script type="module" src="/admin.js"></script></body></html>
